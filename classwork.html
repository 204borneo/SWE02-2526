<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Currency Exchange - Classwork 02</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      margin-bottom: 6px;
      color: #e0e0ff;
    }

    .subtitle {
      text-align: center;
      font-size: 0.85rem;
      color: #aab;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #bbb;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input[type="number"], select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      margin-bottom: 18px;
      outline: none;
      transition: border 0.2s;
    }

    input[type="number"]:focus, select:focus {
      border-color: #7c83fd;
    }

    input[type="date"] {
      width: 100%;
      padding: 12px 16px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 1rem;
      margin-bottom: 18px;
      outline: none;
      transition: border 0.2s;
      color-scheme: dark;
    }

    input[type="date"]:focus {
      border-color: #7c83fd;
    }

    select option { background: #1a1a2e; color: #fff; }

    .row {
      display: flex;
      gap: 14px;
    }

    .row > div { flex: 1; }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: linear-gradient(90deg, #7c83fd, #5c6bc0);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }

    button:hover { opacity: 0.88; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #result {
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      background: rgba(124, 131, 253, 0.15);
      border: 1px solid rgba(124,131,253,0.3);
      text-align: center;
      display: none;
    }

    #result .amount-out {
      font-size: 2rem;
      font-weight: 700;
      color: #a5b4fc;
    }

    #result .rate-info {
      font-size: 0.82rem;
      color: #99a;
      margin-top: 6px;
    }

    #error {
      margin-top: 18px;
      color: #ff8a80;
      font-size: 0.88rem;
      text-align: center;
      display: none;
    }

    .spinner {
      display: none;
      text-align: center;
      margin-top: 18px;
      color: #aab;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💱 Currency Exchange</h1>
    <p class="subtitle">Classwork 02 — Bjorni Pasha</p>

    <label for="amount">Amount</label>
    <input type="number" id="amount" placeholder="Enter amount" min="0" value="1" />

    <div class="row">
      <div>
        <label for="from">From</label>
        <select id="from"></select>
      </div>
      <div>
        <label for="to">To</label>
        <select id="to"></select>
      </div>
    </div>

    <label for="date">Date <span style="color:#888;font-size:0.75rem;text-transform:none;">(today = live rates)</span></label>
    <input type="date" id="date" />

    <button id="convertBtn" onclick="convertCurrency()">Convert</button>

    <div class="spinner" id="spinner">⏳ Fetching rates...</div>

    <div id="result">
      <div class="amount-out" id="outputAmount"></div>
      <div class="rate-info" id="rateInfo"></div>
    </div>

    <div id="error"></div>
  </div>

  <script src="classwork.js"></script>
</body>
</html>
